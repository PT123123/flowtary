[workspace]
resolver = "3"
members = [".", "vendor/goz/crates/goz-core", "vendor/goz/crates/goz-winfs"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Mustafa Ahci"]

[workspace.dependencies]
zerocopy = { version = "0.8", features = ["derive"] }
memchr = "2.7"
rustc-hash = "2"
hashbrown = { version = "0.16", default-features = false, features = ["inline-more"] }
rayon = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
unicode-normalization = "0.1"
proptest = "1"
criterion = "0.5"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO",
  "Win32_System_Ioctl", "Win32_Security", "Win32_Security_Authorization",
  "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_SystemServices",
  "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Performance",
  "Win32_System_Registry",
  "Win32_System_Services",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[package]
name = "flowtary-indexer"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
goz-core = { path = "vendor/goz/crates/goz-core" }
goz-winfs = { path = "vendor/goz/crates/goz-winfs" }
serde.workspace = true
serde_json.workspace = true
memchr.workspace = true
anyhow = "1"
crc32fast = "1"
mft = { version = "=0.9.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
windows-service = "=0.8.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
debug = 1
